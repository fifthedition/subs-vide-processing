<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Breathwork Studio</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="alternate icon" href="/favicon.ico"><meta name="theme-color" content="#1746c6"><link rel="stylesheet" href="/styles.css"><script src="/i18n.js" defer></script><script src="/login.js" defer></script></head>
<body class="login-page"><main class="login-card"><div class="login-top"><div class="eyebrow">BREATHWORK STUDIO</div><div class="language-switch" role="group" aria-label="Interface language"><button type="button" data-language="sk" lang="sk" aria-pressed="true">SK</button><button type="button" data-language="en" lang="en" aria-pressed="false">EN</button></div></div><h1 id="loginHeading">Sign in</h1><p id="loginNote">Your sessions, music and queued exports.</p>
<form id="loginForm"><label id="setupLabel" hidden>First-time setup code<input id="setupCode" type="password" autocomplete="off"></label><label>Username<input id="username" autocomplete="username" required minlength="3" maxlength="80"></label><label>Password<input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="256"></label><p id="loginError" class="validation" role="alert" hidden></p><button class="button primary" id="signIn" type="submit">Sign in</button></form></main></body></html>
