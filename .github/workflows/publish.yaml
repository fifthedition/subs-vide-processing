name: Publish Docker image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check release source
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Require Docker Hub token
        env:
          TOKEN_PRESENT: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: test "$TOKEN_PRESENT" = true || { echo 'Configure DOCKERHUB_TOKEN in repository Actions secrets.'; exit 1; }
      - uses: docker/login-action@v4
        with:
          username: sixthedition
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: sixthedition/subs-video-processor
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
