name: Test and build
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install FFmpeg
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js && node --check static/login.js && node --check static/i18n.js && node --check static/recorder.js && node --check static/recorder-worklet.js && node --check static/narration.js
      - run: npm ci --ignore-scripts && npm test
      - name: Build the public image
        run: docker build -t breathwork-ci .
      - name: Check first boot and private default
        run: |
          docker run -d --name studio-ci --read-only --tmpfs /tmp:size=512m --cap-drop ALL --security-opt no-new-privileges:true -v studio-ci-data:/data -e STUDIO_PUBLIC_URL=https://studio.example -p 127.0.0.1:8789:8787 breathwork-ci
          python tests/container_smoke.py
      - name: Container diagnostics
        if: failure()
        run: docker logs studio-ci || true
      - name: Clean up
        if: always()
        run: |
          docker rm -f studio-ci || true
          docker volume rm studio-ci-data || true
